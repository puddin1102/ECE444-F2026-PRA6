[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
target-version = ["py312"]

[tool.coverage.run]
source = ["project"]
[project]
name = "ece444-pra6-flaskr"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.3",
    "Flask-SQLAlchemy==3.1.1",
    "SQLAlchemy==2.1.5",
    "psycopg2-binary==2.9.13",
    "bleach==6.4.0",
    "python-dotenv==1.2.4",
]

